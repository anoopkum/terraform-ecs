name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'

env:
  TF_VERSION: '1.10.0'
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

# Cancel in-progress runs for the same branch
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #############################################
  # PR VALIDATION - Runs on Pull Request
  #############################################
  
  terraform-fmt:
    name: Format Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Comment on Format Failure
        if: steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ❌ Terraform Format Check Failed
              
              Please run the following command to fix formatting:
              
              \`\`\`bash
              terraform fmt -recursive
              \`\`\`
              
              Then commit and push the changes.`
            })

      - name: Fail if format check failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  terraform-validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color 2>&1 | tee validate_output.txt
        continue-on-error: true

      - name: Comment on Validation Failure
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('validate_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ❌ Terraform Validation Failed
              
              \`\`\`
              ${output}
              \`\`\`
              
              Please fix the validation errors and push again.`
            })

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [terraform-fmt, terraform-validate]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file=ecs.tfvars -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create Plan Summary
        id: summary
        run: |
          if grep -q "No changes" plan_output.txt; then
            echo "status=✅ No infrastructure changes" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif grep -q "Error:" plan_output.txt; then
            echo "status=❌ Plan failed with errors" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            ADD=$(grep -oP '\d+(?= to add)' plan_output.txt || echo "0")
            CHANGE=$(grep -oP '\d+(?= to change)' plan_output.txt || echo "0")
            DESTROY=$(grep -oP '\d+(?= to destroy)' plan_output.txt || echo "0")
            echo "status=📊 Plan: +$ADD ~$CHANGE -$DESTROY" >> $GITHUB_OUTPUT
            if [ "$DESTROY" -gt "0" ]; then
              echo "emoji=⚠️" >> $GITHUB_OUTPUT
            else
              echo "emoji=✅" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const truncatedPlan = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            
            const output = `### ${{ steps.summary.outputs.emoji }} Terraform Plan Results
            
            **Status:** ${{ steps.summary.outputs.status }}
            
            <details>
            <summary>📋 Click to expand plan details</summary>
            
            \`\`\`hcl
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            ---
            *Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Terraform Plan Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "❌ Terraform plan failed. Please check the errors above."
          exit 1

  #############################################
  # APPLY - Runs only after merge to main
  #############################################
  
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=ecs.tfvars -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Apply Status Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Terraform apply completed successfully!"
          else
            echo "❌ Terraform apply failed!"
          fi
